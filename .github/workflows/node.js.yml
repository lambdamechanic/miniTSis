# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [16.x, 18.x, 20.x]

    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install all workspaces
        run: npm ci

      - name: Build shared packages
        run: |
          npm run build --workspace @minitsis/core
          npm run build --workspace minitsis-datastore
          npm run build --workspace @minitsis/testkit

      - name: Build adapters
        run: |
          npm run build --workspace minitsis-node
          npm run build --workspace minitsis-browser

      - name: Test Node adapter
        run: npm test --workspace minitsis-node

      - name: Test Browser adapter (jsdom)
        run: npm test --workspace minitsis-browser
