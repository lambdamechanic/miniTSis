name: Publish to npm

on:
  workflow_run:
    workflows:
      - Node Adapter CI
      - Browser Adapter CI
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Require green Node & Browser CI for this commit
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.workflow_run?.head_sha || context.sha;
            const required = ["Node Adapter CI", "Browser Adapter CI"];
            const {data} = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
              filter: 'latest'
            });

            const status = new Map(required.map(name => [name, false]));
            for (const run of data.check_runs) {
              if (required.includes(run.name) && run.conclusion === 'success') {
                status.set(run.name, true);
              }
            }

            const missing = [...status.entries()].filter(([, ok]) => !ok).map(([name]) => name);
            if (missing.length) {
              core.setFailed(`Required workflows not successful for ${sha}: ${missing.join(', ')}`);
            }

            core.exportVariable('TARGET_SHA', sha);
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_SHA || github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: npm ci

      - name: Build and publish with Changesets (OIDC)
        uses: changesets/action@v1.6.2
        with:
          publish: "NPM_CONFIG_PROVENANCE=true npm run publish-packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
