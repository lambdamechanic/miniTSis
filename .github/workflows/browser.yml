name: Browser Adapter CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_call:

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      - name: Install all workspaces
        run: npm ci
      - name: Build shared packages
        run: |
          npm run build --workspace minitsis-datastore
          npm run build --workspace minitsis
          npm run build --workspace minitsis-testkit
      - name: Build browser adapter
        run: npm run build --workspace minitsis-browser
      - name: Test browser adapter (jsdom)
        run: npm test --workspace minitsis-browser
