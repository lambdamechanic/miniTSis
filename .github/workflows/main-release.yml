name: Main CI + Publish

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    uses: ./.github/workflows/node.yml

  browser:
    uses: ./.github/workflows/browser.yml

  release:
    runs-on: ubuntu-latest
    needs: [node, browser]
    timeout-minutes: 10
    if: always()
    steps:
      - name: Verify CI results
        run: |
          set -euo pipefail
          echo "Node result: ${{ needs.node.result }}"
          echo "Browser result: ${{ needs.browser.result }}"
          if [ "${{ needs.node.result }}" = "skipped" ] || [ "${{ needs.browser.result }}" = "skipped" ]; then
            which_skipped=""
            [ "${{ needs.node.result }}" = "skipped" ] && which_skipped="Node"
            [ "${{ needs.browser.result }}" = "skipped" ] && which_skipped="${which_skipped:+$which_skipped, }Browser"
            echo "::error::Release blocked because ${which_skipped} CI was skipped; ensure both node and browser workflows run for this commit."
            exit 1
          fi
          if [ "${{ needs.node.result }}" != "success" ] || [ "${{ needs.browser.result }}" != "success" ]; then
            echo "::error::Release blocked because required CI jobs did not succeed."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for pending changesets
        id: changesets
        run: |
          set -euo pipefail
          if ls .changeset/*.md >/dev/null 2>&1; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.changesets.outputs.has_changesets == 'true'
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
          always-auth: true

      - name: Install
        if: steps.changesets.outputs.has_changesets == 'true'
        run: npm ci

      - name: Verify publish prerequisites
        if: steps.changesets.outputs.has_changesets == 'true'
        run: npm run release:check-prereqs

      - name: Version packages (changesets) and commit
        if: steps.changesets.outputs.has_changesets == 'true'
        run: |
          set -euo pipefail
          npm exec --no -- changeset version

          if git diff --quiet; then
            echo "::error::changeset version produced no git changes; refusing to continue with publish/tag."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): version packages"

      - name: Publish packages (OIDC)
        if: steps.changesets.outputs.has_changesets == 'true'
        run: NPM_CONFIG_PROVENANCE=true npm run publish-packages

      - name: Create release artifacts
        if: steps.changesets.outputs.has_changesets == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! bash .github/scripts/create-release-artifacts.sh; then
            echo "::error::Release artifacts failed after successful publish."
            exit 1
          fi

      - name: Push version bump commit to main
        if: steps.changesets.outputs.has_changesets == 'true'
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          remote_main="$(git rev-parse origin/main)"
          if ! git merge-base --is-ancestor "${remote_main}" HEAD; then
            echo "::error::origin/main moved during release; refusing to push version bump commit. Manual intervention required."
            echo "::error::origin/main=${remote_main}"
            echo "::error::release_commit=$(git rev-parse HEAD)"
            exit 1
          fi
          git push origin HEAD:refs/heads/main
