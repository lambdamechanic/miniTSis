name: Main CI + Publish

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    uses: ./.github/workflows/node.yml

  browser:
    uses: ./.github/workflows/browser.yml

  release:
    runs-on: ubuntu-latest
    needs: [node, browser]
    timeout-minutes: 20
    if: always()
    steps:
      - name: Verify CI results
        run: |
          set -euo pipefail
          echo "Node result: ${{ needs.node.result }}"
          echo "Browser result: ${{ needs.browser.result }}"
          if [ "${{ needs.node.result }}" != "success" ] || [ "${{ needs.browser.result }}" != "success" ]; then
            echo "::error::Release blocked because required CI jobs did not succeed."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for pending changesets
        id: changesets
        run: |
          set -euo pipefail
          if [ ! -d .changeset ]; then
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGES=$(ls .changeset | grep -E '^[^.].*\\.md$' || true)
          if [ -n "$CHANGES" ]; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.changesets.outputs.has_changesets == 'true'
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Verify publish token available
        if: steps.changesets.outputs.has_changesets == 'true'
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_TOKEN:-}" ]; then
            echo "::error::GITHUB_TOKEN is required for publishing."
            exit 1
          fi

      - name: Install
        if: steps.changesets.outputs.has_changesets == 'true'
        run: npm ci

      - name: Build and publish with Changesets (OIDC)
        if: steps.changesets.outputs.has_changesets == 'true'
        uses: changesets/action@v1.5.3
        with:
          publish: "NPM_CONFIG_PROVENANCE=true npm run publish-packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
