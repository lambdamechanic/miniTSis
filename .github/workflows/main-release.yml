      - name: Check for pending changesets
        id: changesets
        run: |
          set -euo pipefail
          STATUS=$(npx changeset status --output=stdout)
          export STATUS
          HAS=$(node -e "const s=JSON.parse(process.env.STATUS); console.log(s.releases && s.releases.length > 0 ? 'true' : 'false');")
          echo "has_changesets=$HAS" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.changesets.outputs.has_changesets == 'true'
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Verify publish token available
        if: steps.changesets.outputs.has_changesets == 'true'
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_TOKEN:-}" ]; then
            echo "::error::GITHUB_TOKEN is required for publishing."
            exit 1
          fi

      - name: Install
        if: steps.changesets.outputs.has_changesets == 'true'
        run: npm ci

      - name: Build and publish with Changesets (OIDC)
        if: steps.changesets.outputs.has_changesets == 'true'
        uses: changesets/action@v1.5.3
        with:
          publish: "NPM_CONFIG_PROVENANCE=true npm run publish-packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
