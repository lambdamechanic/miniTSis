name: Main CI + Publish

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    uses: ./.github/workflows/node.yml

  browser:
    uses: ./.github/workflows/browser.yml

  release:
    runs-on: ubuntu-latest
    needs: [node, browser]
    timeout-minutes: 10
    if: always()
    steps:
      - name: Verify CI results
        run: |
          set -euo pipefail
          echo "Node result: ${{ needs.node.result }}"
          echo "Browser result: ${{ needs.browser.result }}"
          if [ "${{ needs.node.result }}" = "skipped" ] || [ "${{ needs.browser.result }}" = "skipped" ]; then
            which_skipped=""
            [ "${{ needs.node.result }}" = "skipped" ] && which_skipped="Node"
            [ "${{ needs.browser.result }}" = "skipped" ] && which_skipped="${which_skipped:+$which_skipped, }Browser"
            echo "::error::Release blocked because ${which_skipped} CI was skipped; ensure both node and browser workflows run for this commit."
            exit 1
          fi
          if [ "${{ needs.node.result }}" != "success" ] || [ "${{ needs.browser.result }}" != "success" ]; then
            echo "::error::Release blocked because required CI jobs did not succeed."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for pending changesets
        id: changesets
        run: |
          set -euo pipefail
          STATUS=$(npx changeset status --output=stdout)
          if ! command -v jq >/dev/null 2>&1; then
            echo "::error::jq is required for changeset detection" >&2
            exit 1
          fi
          HAS=$(printf '%s' "$STATUS" | jq -r '(.releases | length) > 0')
          echo "has_changesets=$HAS" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.changesets.outputs.has_changesets == 'true'
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        if: steps.changesets.outputs.has_changesets == 'true'
        run: npm ci

      - name: Build and publish with Changesets (OIDC)
        if: steps.changesets.outputs.has_changesets == 'true'
        uses: changesets/action@v1.5.3
        with:
          publish: "NPM_CONFIG_PROVENANCE=true npm run publish-packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
